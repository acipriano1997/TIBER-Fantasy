name: Command Center Certification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: command-center-certification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate0:
    name: Gate 0 truth boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck Gate 0 delta against baseline debt
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/tiber-typecheck.log 2>&1
          typecheck_status=$?
          set -e

          gate0_pattern='^(server/index\.ts|server/middleware/personalUserScope\.ts|server/routes/leagueDashboardRoutes\.ts|server/routes/leagueSyncRoutes\.ts|server/routes/weeklyDecisionRuntimeRoutes\.ts|server/services/leagueDashboardTruthBoundary\.ts|server/services/commandCenterLeagueContextService\.ts|server/services/weeklyDecisionRuntimeService\.ts|server/leagueContext/.*\.ts|server/platformSync/leagueAwareSync\.ts|shared/weeklyDecisionContract\.ts|client/src/pages/CommandCenterV1\.tsx)\('
          if grep -E "$gate0_pattern" /tmp/tiber-typecheck.log; then
            echo "::error::Gate 0 introduced or exposes type errors in its production files."
            exit 1
          fi

          if [ "$typecheck_status" -ne 0 ]; then
            error_count=$(grep -c 'error TS' /tmp/tiber-typecheck.log || true)
            echo "::warning::Repository-wide typecheck has ${error_count} pre-existing errors outside the Gate 0 production delta; recorded as baseline debt and not treated as a new regression."
          else
            echo "Repository-wide typecheck is clean."
          fi
      - name: Run Gate 0 truth and freshness regressions
        run: >-
          npm test --
          server/middleware/__tests__/personalUserScope.test.ts
          server/services/__tests__/leagueDashboardTruthBoundary.test.ts
          server/services/__tests__/commandCenterLeagueContextService.test.ts
          server/services/__tests__/weeklyDecisionRuntimeService.test.ts
          server/services/__tests__/weeklyDecisionContract.test.ts
          server/services/__tests__/weeklyDecisionSourceLineage.test.ts
          server/services/__tests__/weeklyDecisionLedger.test.ts
          server/services/__tests__/weeklyDecisionGoldenTraces.test.ts
          server/routes/__tests__/leagueContextCommandCenter.test.ts
          server/routes/__tests__/weeklyDecisionRuntimeRoutes.test.ts
          server/modules/management/__tests__/forgeTeamDirectionFreshnessPolicy.test.ts
          server/leagueContext/__tests__/leagueContextV1.test.ts
          server/leagueContext/__tests__/ccfLineupLeagueAdapter.test.ts
          server/leagueContext/__tests__/decisionPacketLeagueContext.test.ts
          server/leagueContext/__tests__/devyRightsSnapshot.test.ts
          server/leagueContext/__tests__/formatIsolation.test.ts
          server/leagueContext/__tests__/weeklyDecisionBinding.test.ts
          server/leagueContext/__tests__/commandCenterLegacyQuarantine.test.ts
      - name: Build application
        run: sh build.sh
