name: USR-0 Certification

on:
  pull_request:
    paths:
      - 'server/modules/uncertaintyRegistry/**'
      - 'docs/architecture/FFCC_UNCERTAINTY_STATE_REGISTRY_USR0.md'
      - '.github/workflows/usr0-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usr0-certification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Contracts, policy, replay, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run USR-0 focused tests
        run: npm test -- server/modules/uncertaintyRegistry/__tests__
      - name: Typecheck USR-0 delta against repository baseline debt
        run: |
          set +e
          npm run typecheck > /tmp/usr0-typecheck.log 2>&1
          typecheck_status=$?
          set -e
          cat /tmp/usr0-typecheck.log
          if grep -E '^server/modules/uncertaintyRegistry/.*error TS' /tmp/usr0-typecheck.log; then
            echo "::error::USR-0 introduced or exposes TypeScript errors."
            exit 1
          fi
          if [ "$typecheck_status" -ne 0 ]; then
            echo "::warning::Full repository typecheck retains pre-existing baseline debt; no USR-0 path errors detected."
          fi
      - name: Build application
        run: sh build.sh
