name: Core Build

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'reports/**'
      - '.claude/**'
      - '**/__tests__/**'
      - '**/fixtures/**'
      - '**/*.test.ts'
      - '**/*.test.tsx'
      - '**/*.spec.ts'
      - '**/*.spec.tsx'
      - '**/prework_*.ts'
      - '**/prework_*.tsx'
      - 'scripts/throughput/**'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build application
        run: sh build.sh
