name: Sleeper Sync CI

on:
  pull_request:
    paths:
      - 'server/sleeperRoutes.ts'
      - 'server/services/sleeperSyncService.ts'
      - 'server/services/sleeperSyncV2/**'
      - 'server/sleeperAPI.ts'
      - 'server/config/season.ts'
      - 'server/index.ts'
      - 'server/routes/healthRoutes.ts'
      - 'server/routes/sleeperUsageTruthBoundary.ts'
      - 'server/routes/__tests__/healthRoutes.test.ts'
      - 'server/routes/__tests__/sleeperUsageTruthBoundary.test.ts'
      - 'client/src/pages/dashboard.tsx'
      - 'client/src/hooks/useLeagueContext.ts'
      - 'scripts/test-sleeper-sync.sh'
      - 'docs/sleeper-sync/**'
      - '.github/workflows/sleeper-sync.yml'
  push:
    branches:
      - main
    paths:
      - 'server/sleeperRoutes.ts'
      - 'server/services/sleeperSyncService.ts'
      - 'server/services/sleeperSyncV2/**'
      - 'server/sleeperAPI.ts'
      - 'server/config/season.ts'
      - 'server/index.ts'
      - 'server/routes/healthRoutes.ts'
      - 'server/routes/sleeperUsageTruthBoundary.ts'
      - 'server/routes/__tests__/healthRoutes.test.ts'
      - 'server/routes/__tests__/sleeperUsageTruthBoundary.test.ts'
      - 'scripts/test-sleeper-sync.sh'
      - '.github/workflows/sleeper-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sleeper-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sleeper-sync-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tiber
          POSTGRES_PASSWORD: tiber
          POSTGRES_DB: tiber_sleeper_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tiber -d tiber_sleeper_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      USE_SLEEPER_SYNC: 'true'
      APP_BASE_URL: 'http://127.0.0.1:5000'
      DATABASE_URL: 'postgresql://tiber:tiber@127.0.0.1:5432/tiber_sleeper_ci'
      NODE_ENV: 'test'
      PORT: '5000'
      SLEEPER_USERNAME: ${{ secrets.SLEEPER_USERNAME }}
      SLEEPER_USER_ID: ${{ secrets.SLEEPER_USER_ID }}
      SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck Sleeper/health delta against baseline debt
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/tiber-typecheck.log 2>&1
          typecheck_status=$?
          set -e

          sleeper_pattern='^(server/(index\.ts|routes/(healthRoutes|sleeperUsageTruthBoundary)\.ts|routes/__tests__/(healthRoutes|sleeperUsageTruthBoundary)\.test\.ts|services/sleeperSyncService\.ts|services/sleeperSyncV2/.*\.ts|sleeperRoutes\.ts|sleeperAPI\.ts|config/season\.ts))\('
          if grep -E "$sleeper_pattern" /tmp/tiber-typecheck.log; then
            echo "::error::Sleeper/health CI delta contains TypeScript errors."
            exit 1
          fi

          if [ "$typecheck_status" -ne 0 ]; then
            error_count=$(grep -c 'error TS' /tmp/tiber-typecheck.log || true)
            echo "::warning::Repository-wide typecheck has ${error_count} baseline errors outside this CI delta."
          else
            echo "Repository-wide typecheck is clean."
          fi

      - name: Run focused Sleeper and runtime truth regressions
        run: >-
          npm test --
          server/routes/__tests__/healthRoutes.test.ts
          server/routes/__tests__/sleeperUsageTruthBoundary.test.ts
          server/services/sleeperSyncV2/__tests__/schedulerTargeting.test.ts
          server/config/__tests__/season.test.ts
          server/services/__tests__/leagueDashboardTruthBoundary.test.ts

      - name: Build release artifact
        run: sh build.sh

      - name: Smoke release runtime and optional live Sleeper integration
        shell: bash
        run: |
          set -euo pipefail

          nohup node dist/index.mjs > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for i in {1..30}; do
            if curl -fsS "$APP_BASE_URL/api/health" >/tmp/api-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Release server did not become live."
            cat server.log || true
            exit 1
          fi

          curl -fsS "$APP_BASE_URL/api/health/db" >/tmp/db-health.json
          echo "API liveness: $(cat /tmp/api-health.json)"
          echo "DB readiness: $(cat /tmp/db-health.json)"

          if [ -z "${SLEEPER_USERNAME:-}" ] || [ -z "${SLEEPER_USER_ID:-}" ] || [ -z "${SLEEPER_LEAGUE_ID:-}" ]; then
            echo "::notice::Sleeper credentials are not configured; external live smoke skipped. Focused tests, release build, API liveness, and DB readiness still passed."
            exit 0
          fi

          chmod +x ./scripts/test-sleeper-sync.sh
          ./scripts/test-sleeper-sync.sh "$APP_BASE_URL" "$SLEEPER_USERNAME" "$SLEEPER_USER_ID" "$SLEEPER_LEAGUE_ID"

          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          trap - EXIT
          sleep 1

          USE_SLEEPER_SYNC=false nohup node dist/index.mjs > server-disabled.log 2>&1 &
          disabled_pid=$!
          trap 'kill "$disabled_pid" 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl -fsS "$APP_BASE_URL/api/health" >/dev/null; then
              break
            fi
            sleep 1
          done

          response_code=$(curl -sS -o /tmp/sleeper-disabled.json -w "%{http_code}" "$APP_BASE_URL/api/sleeper/health")
          if [ "$response_code" != "503" ]; then
            echo "::error::Expected /api/sleeper/health to return 503 when disabled, got $response_code"
            cat /tmp/sleeper-disabled.json || true
            exit 1
          fi
          echo "Sleeper feature-disabled health correctly returned 503."

      - name: Display server logs on failure
        if: failure()
        run: |
          echo "=== server.log ==="
          cat server.log || true
          echo "=== server-disabled.log ==="
          cat server-disabled.log || true
