name: Breakout V1 Chronological OOS Research

on:
  push:
    branches:
      - research/run-breakout-v1-oos
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scikit-learn

      - name: Run chronological OOS breakout v1 backtest
        run: python scripts/research/run_breakout_v1_oos.py

      - name: Show report
        run: cat outputs/research/breakout_v1_oos/report.json

      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: breakout-v1-oos-research
          path: outputs/research/breakout_v1_oos/
