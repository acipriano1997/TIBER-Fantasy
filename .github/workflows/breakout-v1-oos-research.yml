name: Breakout V1 Chronological OOS Research

on:
  push:
    branches:
      - research/run-breakout-v1-oos
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Inspect governed pre-2025 field contract only
        run: python scripts/research/inspect_tiber_data_pre2025.py
