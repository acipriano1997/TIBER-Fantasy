name: Gate 5 Dependency Refresh

# Temporary branch-only helper. Gate 5 removes this workflow before the final
# release PR; its only purpose is to reconcile the lock graph after dependency
# classification/security changes and commit the resulting package-lock.json.
on:
  push:
    branches:
      - codex/gate5-release-freeze
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/gate5-dependency-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/gate5-release-freeze

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Reconcile dependency classification with lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Apply compatible production audit fixes to lockfile
        shell: bash
        run: |
          # npm audit fix returns non-zero while any advisory remains, including
          # moderate-only findings. Gate 5's actual policy is enforced by the
          # next step, which rejects HIGH/CRITICAL production findings.
          npm audit fix --package-lock-only --omit=dev --ignore-scripts || true

      - name: Reject residual high or critical production advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json package.json; then
            echo 'No dependency refresh changes were produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'Refresh Gate 5 production dependency lockfile'
          git push origin HEAD:codex/gate5-release-freeze
