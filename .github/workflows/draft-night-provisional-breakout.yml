name: Draft Night Provisional Breakout

on:
  push:
    branches:
      - feat/draft-night-provisional-breakout-badges
  workflow_dispatch:

jobs:
  score:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scorer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scikit-learn

      - name: Build 2026 provisional breakout tags
        run: python scripts/research/build_breakout_v1_4_2026_provisional.py
