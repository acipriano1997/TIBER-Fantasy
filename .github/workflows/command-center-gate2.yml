name: Command Center Gate 2

on:
  pull_request:
    paths:
      - 'shared/weeklyDecisionContract.ts'
      - 'shared/weeklyDecisionChallenger.ts'
      - 'shared/commandCenterV1InvariantManifest.ts'
      - 'shared/commandCenterV1VerificationManifest.ts'
      - 'server/services/leagueDashboardTruthBoundary.ts'
      - 'server/services/weeklyDecisionLedger.ts'
      - 'server/services/weeklyDecisionLedgerRepository.ts'
      - 'server/services/weeklyDecisionPostgameEvaluation.ts'
      - 'server/services/__tests__/leagueDashboardTruthBoundary.test.ts'
      - 'server/services/__tests__/commandCenterV1InvariantReplay.test.ts'
      - 'server/services/__tests__/weeklyDecisionContract.test.ts'
      - 'server/services/__tests__/weeklyDecisionChallenger.test.ts'
      - 'server/services/__tests__/weeklyDecisionSourceLineage.test.ts'
      - 'server/services/__tests__/weeklyDecisionGoldenTraces.test.ts'
      - 'server/services/__tests__/golden/weeklyDecisionGate2GoldenTraces.ts'
      - 'server/services/__tests__/weeklyDecisionLedger.test.ts'
      - 'server/services/__tests__/weeklyDecisionLedgerPersistence.integration.test.ts'
      - 'server/services/__tests__/weeklyDecisionPostgameEvaluation.test.ts'
      - 'server/services/__tests__/commandCenterV1SurfaceManifest.test.ts'
      - 'server/services/__tests__/commandCenterV1VerificationManifest.test.ts'
      - 'migrations/0016_weekly_decision_ledger_append_only.sql'
      - '.github/workflows/command-center-gate2.yml'
  push:
    branches:
      - main
    paths:
      - 'shared/weeklyDecisionContract.ts'
      - 'shared/weeklyDecisionChallenger.ts'
      - 'shared/commandCenterV1InvariantManifest.ts'
      - 'shared/commandCenterV1VerificationManifest.ts'
      - 'server/services/leagueDashboardTruthBoundary.ts'
      - 'server/services/weeklyDecisionLedger.ts'
      - 'server/services/weeklyDecisionLedgerRepository.ts'
      - 'server/services/weeklyDecisionPostgameEvaluation.ts'
      - 'server/services/__tests__/leagueDashboardTruthBoundary.test.ts'
      - 'server/services/__tests__/commandCenterV1InvariantReplay.test.ts'
      - 'server/services/__tests__/weeklyDecisionContract.test.ts'
      - 'server/services/__tests__/weeklyDecisionChallenger.test.ts'
      - 'server/services/__tests__/weeklyDecisionSourceLineage.test.ts'
      - 'server/services/__tests__/weeklyDecisionGoldenTraces.test.ts'
      - 'server/services/__tests__/golden/weeklyDecisionGate2GoldenTraces.ts'
      - 'server/services/__tests__/weeklyDecisionLedger.test.ts'
      - 'server/services/__tests__/weeklyDecisionLedgerPersistence.integration.test.ts'
      - 'server/services/__tests__/weeklyDecisionPostgameEvaluation.test.ts'
      - 'server/services/__tests__/commandCenterV1SurfaceManifest.test.ts'
      - 'server/services/__tests__/commandCenterV1VerificationManifest.test.ts'
      - 'migrations/0016_weekly_decision_ledger_append_only.sql'
      - '.github/workflows/command-center-gate2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: command-center-gate2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate2-receipt-replay:
    name: Gate 2 verification boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tiber
          POSTGRES_PASSWORD: tiber
          POSTGRES_DB: tiber_gate2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tiber -d tiber_gate2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tiber:tiber@localhost:5432/tiber_gate2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck Gate 2 delta against baseline debt
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/tiber-typecheck.log 2>&1
          typecheck_status=$?
          set -e

          gate2_pattern='^(shared/(weeklyDecisionContract|weeklyDecisionChallenger|commandCenterV1InvariantManifest|commandCenterV1VerificationManifest)\.ts|server/services/(leagueDashboardTruthBoundary|weeklyDecisionLedger|weeklyDecisionLedgerRepository|weeklyDecisionPostgameEvaluation)\.ts|server/services/__tests__/(leagueDashboardTruthBoundary|commandCenterV1InvariantReplay|weeklyDecisionContract|weeklyDecisionChallenger|weeklyDecisionSourceLineage|weeklyDecisionGoldenTraces|weeklyDecisionLedger|weeklyDecisionLedgerPersistence\.integration|weeklyDecisionPostgameEvaluation|commandCenterV1SurfaceManifest|commandCenterV1VerificationManifest)\.test\.ts|server/services/__tests__/golden/weeklyDecisionGate2GoldenTraces\.ts)\('
          if grep -E "$gate2_pattern" /tmp/tiber-typecheck.log; then
            echo "::error::Gate 2 verification delta contains TypeScript errors."
            exit 1
          fi

          if [ "$typecheck_status" -ne 0 ]; then
            error_count=$(grep -c 'error TS' /tmp/tiber-typecheck.log || true)
            echo "::warning::Repository-wide typecheck has ${error_count} baseline errors outside this Gate 2 delta."
          else
            echo "Repository-wide typecheck is clean."
          fi
      - name: Run Gate 0 + Gate 1 + Gate 2 verification regressions
        run: >-
          npm test --
          server/services/__tests__/leagueDashboardTruthBoundary.test.ts
          server/services/__tests__/commandCenterV1InvariantReplay.test.ts
          server/services/__tests__/weeklyDecisionContract.test.ts
          server/services/__tests__/commandCenterV1SurfaceManifest.test.ts
          server/services/__tests__/weeklyDecisionChallenger.test.ts
          server/services/__tests__/weeklyDecisionSourceLineage.test.ts
          server/services/__tests__/weeklyDecisionGoldenTraces.test.ts
          server/services/__tests__/weeklyDecisionLedger.test.ts
          server/services/__tests__/weeklyDecisionLedgerPersistence.integration.test.ts
          server/services/__tests__/weeklyDecisionPostgameEvaluation.test.ts
          server/services/__tests__/commandCenterV1VerificationManifest.test.ts
      - name: Build application
        run: sh build.sh
